  <style>
    body { font-family: 'Inter', sans-serif; background-color: #030712; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-mono { font-family: 'Fira Code', monospace; }
    .font-hand { font-family: 'Caveat', cursive; }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #030712; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }

    /* Tactical Blueprint Grid */
    .blueprint-grid {
      background-size: 24px 24px;
      background-image: 
        linear-gradient(to right, rgba(14, 165, 233, 0.07) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(14, 165, 233, 0.07) 1px, transparent 1px);
    }

    /* Glow utilities */
    .glow-amber { box-shadow: 0 0 35px -8px rgba(245, 158, 11, 0.25); }
    .glow-cyan { box-shadow: 0 0 35px -8px rgba(14, 165, 233, 0.25); }
    .glow-crimson { box-shadow: 0 0 35px -8px rgba(239, 68, 68, 0.3); }

    /* SVG Interactive Room States */
    .blueprint-room {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .blueprint-room:hover {
      filter: brightness(1.25);
    }

    /* Undercroft restricted pulse */
    @keyframes undercroft-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.35); }
      50% { box-shadow: 0 0 20px 4px rgba(239, 68, 68, 0.25); }
    }
    .undercroft-active {
      animation: undercroft-pulse 2.4s ease-in-out infinite;
    }

    /* Lightbox */
    .lightbox-backdrop {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(2, 6, 23, 0.92);
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
      backdrop-filter: blur(6px);
    }
    .lightbox-card {
      max-width: 920px; width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
    }
    .lightbox-img {
      width: 100%; max-height: 70vh; object-fit: contain;
      background: #020617;
    }

    /* Gate typewriter line */
    .gate-line {
      overflow: hidden;
      white-space: nowrap;
      border-right: 2px solid #f59e0b;
      animation: gate-type 2.8s steps(48, end) 0.3s both, gate-blink 0.8s step-end infinite;
      max-width: 100%;
    }
    @keyframes gate-type {
      from { width: 0; }
      to { width: 100%; }
    }
    @keyframes gate-blink {
      50% { border-color: transparent; }
    }

    /* Artifact card hover for zoom affordance */
    .artifact-img-wrap {
      cursor: zoom-in;
      position: relative;
    }
    .artifact-img-wrap::after {
      content: "Click to enlarge";
      position: absolute; bottom: 8px; right: 8px;
      font-size: 10px; font-family: 'Fira Code', monospace;
      background: rgba(2,6,23,0.85); color: #94a3b8;
      padding: 2px 8px; border-radius: 4px; border: 1px solid #334155;
      opacity: 0; transition: opacity 0.2s;
    }
    .artifact-img-wrap:hover::after { opacity: 1; }
  </style>
</head>

    function App() {
      const [isUnlocked, setIsUnlocked] = useState(false);
      const [passInput, setPassInput] = useState('');
      const [passError, setPassError] = useState(false);
      const [activeRoom, setActiveRoom] = useState(REPOSITORY_DATA.rooms[0]);
      const [activeTab, setActiveTab] = useState('inventory'); // 'inventory', 'appraisal', 'marginalia'
      const [lightboxItem, setLightboxItem] = useState(null);
      const [clearedAt, setClearedAt] = useState(null);
      const [showGateIntro, setShowGateIntro] = useState(true);

      useEffect(() => {
        const saved = localStorage.getItem('swiss_vault_clearance');
        const ts = localStorage.getItem('swiss_vault_cleared_at');
        if (saved === 'granted') {
          setIsUnlocked(true);
          if (ts) setClearedAt(ts);
        }
      }, []);

      useEffect(() => {
        if (!lightboxItem) return;
        const onKey = (e) => { if (e.key === 'Escape') setLightboxItem(null); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [lightboxItem]);

      const handleUnlock = (e) => {
        e.preventDefault();
        const clean = passInput.trim().toUpperCase();
        if (VALID_CODES.includes(clean)) {
          const ts = new Date().toISOString();
          setIsUnlocked(true);
          setPassError(false);
          setClearedAt(ts);
          localStorage.setItem('swiss_vault_clearance', 'granted');
          localStorage.setItem('swiss_vault_cleared_at', ts);
        } else {
          setPassError(true);
        }
      };

      const handleRelock = () => {
        setIsUnlocked(false);
        setClearedAt(null);
        setLightboxItem(null);
        localStorage.removeItem('swiss_vault_clearance');
        localStorage.removeItem('swiss_vault_cleared_at');
        setPassInput('');
        setShowGateIntro(true);
      };

      const formatCleared = (iso) => {
        if (!iso) return '';
        try {
          const d = new Date(iso);
          return d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
        } catch { return iso; }
      };

      // --- GATE SCREEN ---
      if (!isUnlocked) {
        return (
          <div className="min-h-screen bg-slate-950 flex flex-col justify-center items-center p-6 blueprint-grid relative">

                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                  </svg>
                </div>
                <h1 className="text-2xl font-cinzel font-black tracking-widest text-amber-300">SWISS REPOSITORY</h1>
                <p className="text-[10px] font-mono uppercase tracking-widest text-slate-400">
                  Canton of Valais // Est. 1803 CE // Depth 200 ft
                </p>
                <div className="h-px w-20 bg-amber-500/40 mx-auto" />
                <p className="text-[11px] font-mono text-amber-500/90 gate-line mx-auto" style={{ maxWidth: '100%' }}>
                  SOLE FIDUCIARY CUSTODIANSHIP // WHITMORE STERLING 1678
                </p>
                <p className="text-xs text-slate-400 italic leading-relaxed px-1">
                  "Unbroken title held in trust without probate severance. Non-divulgence covenants remain in force. Clearance required for adit access."
                </p>
                <p className="text-[10px] font-mono text-slate-500">
                  Authorized phrases only. Attempts are logged.
                </p>
              </div>

              <form onSubmit={handleUnlock} className="space-y-4">
                <div>
                  <label className="block text-[11px] font-mono uppercase text-slate-400 mb-1">
                    Enter Custodial Key / Underwriter Passcode:
                  </label>
                  <input
                    type="text"
                    value={passInput}
                    onChange={(e) => { setPassInput(e.target.value); setPassError(false); }}
                    placeholder="e.g. RIPARIAN-FLOTSAM"
                    className={`w-full bg-slate-950 border px-4 py-3 rounded-lg font-mono text-sm tracking-wider text-white placeholder-slate-600 focus:outline-none transition-colors ${passError ? 'border-rose-500 text-rose-300' : 'border-slate-700 focus:border-amber-400'}`}
                  />
                  {passError && (
                    <p className="text-rose-400 text-xs font-mono mt-1.5 flex items-center gap-1">
                      ⚠️ Invalid Passcode. Verify against Payhip confirmation.
                    </p>
                  )}
                </div>

                <button
                  type="submit"
                  className="w-full bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-slate-950 font-bold font-cinzel py-3 rounded-lg text-sm tracking-widest transition-all shadow-lg"
                >
                  DISENGAGE TUMBLERS & ENTER
                </button>
              </form>

              <div className="mt-8 pt-6 border-t border-slate-800 text-center">
                <p className="text-[10px] text-slate-500 font-mono">
                  [PROMPT PASSCODES]: <code className="text-amber-400/80">RIPARIAN-FLOTSAM</code> • <code className="text-amber-400/80">VALAIS-1803</code> • <code className="text-amber-400/80">ORANGE-BISCUIT</code>

              </div>
            </div>
          </div>
        );

      // --- UNLOCKED INTERACTIVE BLUEPRINT EXPERIENCE ---
      return (
        <div className="min-h-screen bg-slate-950 flex flex-col font-sans blueprint-grid">
          
          {/* Header */}
          <header className="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-30 px-6 py-3 flex flex-wrap justify-between items-center gap-4">
            <div className="flex items-center gap-4">
              <div className="w-10 h-10 rounded-lg bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400">
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                </svg>
              </div>
              <div>
                <h1 className="text-lg font-cinzel font-black tracking-wider text-amber-300">
                  THE SWISS REPOSITORY // 1803
                </h1>
                <p className="text-xs font-mono text-slate-400">
                  2,500 m² (26,909 sq ft) Subterranean Granite Facility • Canton of Valais
                </p>
              </div>
            </div>

                <div className="flex justify-between items-start gap-3 p-4 border-b border-slate-800 bg-slate-900/80">
                  <div>
                    <span className="text-[10px] font-mono text-amber-500 uppercase tracking-widest font-bold">{lightboxItem.id}</span>
                    <h3 className="text-lg font-cinzel font-bold text-white">{lightboxItem.name}</h3>
                    <p className="text-xs font-mono text-slate-400 mt-0.5">{lightboxItem.era} · {lightboxItem.origin}</p>
                  </div>
                  <button
                    onClick={() => setLightboxItem(null)}
                    className="text-slate-400 hover:text-white text-xs font-mono px-2 py-1 rounded border border-slate-700 hover:border-slate-500"
                  >
                    ESC / Close
                  </button>
                </div>
                {lightboxItem.img && (
                  <img src={lightboxItem.img} alt={lightboxItem.name} className="lightbox-img" />
                )}
                <div className="p-4 space-y-2 bg-slate-950">
                  {lightboxItem.plaqueQuote && (
                    <p className="text-sm text-amber-200/90 italic font-serif border-l-2 border-amber-500 pl-3">
                      "{lightboxItem.plaqueQuote}"
                    </p>
                  )}
                  <p className="text-xs text-slate-400 leading-relaxed">{lightboxItem.desc}</p>
                  {lightboxItem.tag && (
                    <p className="text-[10px] font-mono text-slate-500 uppercase tracking-wide pt-1">{lightboxItem.tag}</p>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
